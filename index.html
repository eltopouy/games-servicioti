    padding: 0;

  html, body {

    position: fixed;
    font-family: 'Nunito', sans-serif;

  /* Visor / Ventana de la Cámara */
  #viewport {
    position: absolute;
    inset: 0;

    cursor: grab;
  }

  }

  #world-stage {
    position: absolute;

    left: 0;

    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;

    transform: translateX(-50%) translateY(0);
  }

  /* Percha de Cada Pajarito (Escalado uniforme en el mundo 16:9) */
  .bird-perch {
    position: absolute;
    transform: translate(-50%, -85%);
    cursor: pointer;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    width: 120px;
    height: 120px;
    transition: left 0.65s cubic-bezier(0.2, 0.9, 0.3, 1), top 0.65s cubic-bezier(0.2, 0.9, 0.3, 1), filter 0.2s ease;
  }

  .bird-sprite {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.35));
    transition: transform 0.15s ease;
    pointer-events: none;
    transform-origin: bottom center;
  }

  .bird-perch.is-muted .bird-sprite {
    animation: idleBreathe 3.5s infinite ease-in-out;
  }

  @keyframes idleBreathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-4px) scale(1.02, 0.98); }
  }

  /* Animación de Canto y Rebote Alegre */
  .bird-perch.is-singing .bird-sprite {
    animation: singingBob 0.42s infinite alternate ease-in-out;
    filter: drop-shadow(0 8px 18px rgba(255, 230, 0, 0.7));
  }

    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(-7px) scale(1.05, 0.96); }
  }

    bottom: 25%;
    left: 50%;
    transform: translate(-50%, 50%);
    width: 110%;
    height: 110%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, rgba(255, 218, 121, 0.25) 50%, transparent 70%);
    opacity: 0;
    pointer-events: none;
    z-index: -1;
    transition: opacity 0.3s ease;
  }

  .bird-perch.is-singing .sound-aura {
    opacity: 1;
    animation: auraPulse 1.2s infinite ease-out;
  }

  @keyframes auraPulse {
    0% { transform: translate(-50%, 50%) scale(0.6); opacity: 0.85; }
    100% { transform: translate(-50%, 50%) scale(1.5); opacity: 0; }

    // El escenario cubre siempre el alto y mantiene la vista panorámica 16:9
    if (vpW / vpH >= 16 / 9) {
      stageW = vpW;
      stageH = vpW * (9 / 16);
    } else {
      stageH = vpH;
      stageW = vpH * (16 / 9);
    }

    stage.style.width = `${stageW}px`;
    stage.style.height = `${stageH}px`;

    clampCameraBounds();
    updateCameraTransform(true);
  }

  function updateCameraTransform(immediate = false) {
    if (immediate) {
      camera.x = camera.targetX;
      camera.y = camera.targetY;
      camera.scale = camera.targetScale;
      stage.style.transition = "none";
    } else {
      stage.style.transition = "transform 0.65s cubic-bezier(0.2, 0.9, 0.3, 1)";
    }
    stage.style.transform = `translate3d(${camera.targetX}px, ${camera.targetY}px, 0) scale(${camera.targetScale})`;
  }

  // Acercarse a un pájaro seleccionado
  function zoomToBird(id) {
    const bird = BIRDS[id];
    if (!bird) return;

    camera.isZoomed = true;
    camera.focusedBird = id;
    camera.targetScale = window.innerWidth < 768 ? 2.2 : 1.75;

    const vpW = viewport.clientWidth;
    const vpH = viewport.clientHeight;

    const coords = getBirdCoordinates(id);

    // Coordenadas absolutas del pájaro en el escenario 16:9
    const birdPxX = (coords.pctX / 100) * stageW;
    const birdPxY = (coords.pctY / 100) * stageH;

    // Desplazamiento para centrar exactamente el pájaro en la pantalla
    camera.targetX = (vpW / 2) - (birdPxX * camera.targetScale);
    camera.targetY = (vpH / 2) - (birdPxY * camera.targetScale);

    clampCameraBounds();
    updateCameraTransform(false);
    btnZoomOut.classList.add("show");
  }

  // Volver a la vista completa del paisaje
  function resetZoom() {
    camera.isZoomed = false;
    camera.focusedBird = null;
    camera.targetScale = 1;
    const vpW = viewport.clientWidth;
    if (stageW > vpW) {
      camera.targetX = (vpW - stageW) / 2;
    } else {
      camera.targetX = 0;
    }
    camera.targetY = 0;
    clampCameraBounds();
    updateCameraTransform(false);
    btnZoomOut.classList.remove("show");
  }

  btnZoomOut.addEventListener("click", resetZoom);

  // Limitar bordes del pan para que el paisaje nunca se salga de la vista
  function clampCameraBounds() {
    const vpW = viewport.clientWidth;
    const vpH = viewport.clientHeight;

    const currentW = stageW * camera.targetScale;
    const currentH = stageH * camera.targetScale;

    const minX = vpW - currentW;
    const minY = vpH - currentH;

    if (minX < 0) {
      camera.targetX = Math.min(0, Math.max(minX, camera.targetX));
    } else {
      camera.targetX = (vpW - currentW) / 2;
    }

    if (minY < 0) {
      camera.targetY = Math.min(0, Math.max(minY, camera.targetY));
    } else {
      camera.targetY = (vpH - currentH) / 2;
    }
  }

  // Interacción táctil y de ratón: Arrastre fluido con el dedo (Pan)
  viewport.addEventListener("pointerdown", e => {
    if (e.target.closest(".hud-btn")) return;
    drag.active = true;
    drag.startX = e.clientX;
    drag.startY = e.clientY;
    drag.origX = camera.targetX;
    drag.origY = camera.targetY;
    drag.hasMoved = false;
    stage.style.transition = "none";
  });

  window.addEventListener("pointermove", e => {
    if (!drag.active) return;
    const dx = e.clientX - drag.startX;
    const dy = e.clientY - drag.startY;

    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
      drag.hasMoved = true;
    }

    camera.targetX = drag.origX + dx;
    camera.targetY = drag.origY + dy;
    clampCameraBounds();
    stage.style.transform = `translate3d(${camera.targetX}px, ${camera.targetY}px, 0) scale(${camera.targetScale})`;
  });

  window.addEventListener("pointerup", e => {
    if (!drag.active) return;
    drag.active = false;
    clampCameraBounds();
    updateCameraTransform(false);
  });

  window.addEventListener("resize", () => {
    layoutStage();
  });

  /* =========================================================================
     INTERACCIÓN Y CANTO DE AVES
     ========================================================================= */
  function toggleBird(id, triggeredByClick = true) {
    const hint = document.getElementById("help-hint");
    if (hint) {
      hint.style.opacity = "0";
      setTimeout(() => hint.remove(), 500);
    }

    const audio = audioElements[id];
    const perch = document.getElementById(`perch-${id}`);
    const img = document.getElementById(`img-${id}`);

    showBirdToast(id);

    if (isSinging[id]) {
      isSinging[id] = false;
      audio.pause();
      audio.currentTime = 0;
      perch.classList.remove("is-singing");
      perch.classList.add("is-muted");
      img.src = BIRDS[id].reposo;
      img.setAttribute("data-beak", "closed");
      if (camera.focusedBird === id) resetZoom();
    } else {
      isSinging[id] = true;
      perch.classList.remove("is-muted");
      perch.classList.add("is-singing");
      audio.play().catch(e => console.log("Audio play err", e));
      spawnMusicNote(id);

      if (triggeredByClick) {
        zoomToBird(id);
      }
    }

    updateMasterButtonState();
  }

  // Conectar eventos a cada ave
  Object.keys(BIRDS).forEach(id => {
    const perch = document.getElementById(`perch-${id}`);
    perch.addEventListener("pointerdown", e => {
      e.stopPropagation();
      drag.active = false;
    });
    perch.addEventListener("click", e => {
      e.stopPropagation();
      if (!drag.hasMoved) {
        toggleBird(id, true);
      }
    });
  });

  // Mostrar cartel flotante del nombre del ave
  function showBirdToast(id) {
    const perch = document.getElementById(`perch-${id}`);
    const toast = perch.querySelector(".bird-toast");
    if (!toast) return;

    if (toastTimers[id]) clearTimeout(toastTimers[id]);
    toast.classList.add("show");
    toastTimers[id] = setTimeout(() => {
      toast.classList.remove("show");
    }, 2000);
  }

  // Notas Musicales
  const NOTES = ["♪", "♫", "♬", "♩", "𝅘𝅥𝅯"];
  function spawnMusicNote(id) {
    const perch = document.getElementById(`perch-${id}`);
    const spawner = perch.querySelector(".note-spawner");
    if (!spawner) return;

    const note = document.createElement("span");
    note.className = "music-note";
    note.textContent = NOTES[Math.floor(Math.random() * NOTES.length)];
    const tx = (Math.random() - 0.5) * 60;
    const rot = (Math.random() - 0.5) * 50;
    note.style.setProperty("--tx", `${tx}px`);
    note.style.setProperty("--rot", `${rot}deg`);

    const colors = ["#fffa65", "#ff9ff3", "#54a0ff", "#5f27cd", "#00d2d3", "#ff6b6b"];
    note.style.color = colors[Math.floor(Math.random() * colors.length)];

    spawner.appendChild(note);
    setTimeout(() => note.remove(), 1500);
  }

  // Motor de Sincronización de Pico en Tiempo Real a 60 FPS
  function startLipSyncEngine() {
    let lastNoteTime = 0;

    function frame(now) {
      Object.keys(BIRDS).forEach(id => {
        if (!isSinging[id]) return;

        const img = document.getElementById(`img-${id}`);
        const audio = audioElements[id];
        const t = audio.currentTime || (now * 0.001);

        const isOpen = (Math.sin(t * 22 + (id.charCodeAt(0) % 7)) > 0.12) && ((Math.floor(t * 3.5) % 4) !== 0);

        const currentBeak = img.getAttribute("data-beak");
        if (isOpen && currentBeak !== "open") {
          img.src = BIRDS[id].canto;
          img.setAttribute("data-beak", "open");
        } else if (!isOpen && currentBeak !== "closed") {
          img.src = BIRDS[id].reposo;
          img.setAttribute("data-beak", "closed");
        }
      });

      if (now - lastNoteTime > 600) {
        lastNoteTime = now;
        const singingIds = Object.keys(BIRDS).filter(id => isSinging[id]);
        if (singingIds.length > 0) {
          const randomSinger = singingIds[Math.floor(Math.random() * singingIds.length)];
          spawnMusicNote(randomSinger);
        }
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }

  /* =========================================================================
     BARRA SUPERIOR: MOMENTOS DEL DÍA Y CORO COMPLETO
     ========================================================================= */
  const THEMES = [
    { id: "mediodia", icon: "☀️", name: "Mediodía" },
    { id: "costa", icon: "🏫", name: "Balneario" },
    { id: "atardecer", icon: "🌇", name: "Atardecer" },
    { id: "amanecer", icon: "🌅", name: "Amanecer" }
  ];
  let themeIndex = 0;
  const btnTheme = document.getElementById("btn-theme");
  const themeIcon = document.getElementById("theme-icon");
  const themeText = document.getElementById("theme-text");

  btnTheme.addEventListener("click", () => {
    stage.classList.remove(`theme-${THEMES[themeIndex].id}`);
    themeIndex = (themeIndex + 1) % THEMES.length;
    const current = THEMES[themeIndex];
    stage.classList.add(`theme-${current.id}`);
    themeIcon.textContent = current.icon;
    themeText.textContent = current.name;

    // Si la cámara estaba enfocando a un ave, seguirla con fluidez a su nueva posición
    if (camera.isZoomed && camera.focusedBird) {
      setTimeout(() => zoomToBird(camera.focusedBird), 120);
    }
  });

  const btnMaster = document.getElementById("btn-master");
  const masterIcon = document.getElementById("master-icon");
  const masterText = document.getElementById("master-text");

  function updateMasterButtonState() {
    const anySinging = Object.keys(BIRDS).some(id => isSinging[id]);
    if (anySinging) {
      masterIcon.textContent = "🤫";
      masterText.textContent = "Silencio";
    } else {
      masterIcon.textContent = "🎶";
      masterText.textContent = "Cantar Todos";
    }
  }

  btnMaster.addEventListener("click", () => {
    const anySinging = Object.keys(BIRDS).some(id => isSinging[id]);
    if (anySinging) {
      Object.keys(BIRDS).forEach(id => {
        if (isSinging[id]) toggleBird(id, false);
      });
      resetZoom();
    } else {
      Object.keys(BIRDS).forEach(id => {
        if (!isSinging[id]) toggleBird(id, false);
      });
    }
  });

  // Inicialización
  layoutStage();
  const initVpW = viewport.clientWidth;
  if (stageW > initVpW) {
    camera.targetX = (initVpW - stageW) / 2;
    clampCameraBounds();
    updateCameraTransform(true);
  }

  startLipSyncEngine();

  // Registro de Service Worker para carga offline y caché ultrarrápida
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
