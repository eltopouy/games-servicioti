<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGradP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b75d0" />
      <stop offset="30%" stop-color="#4ba3e3" />
      <stop offset="65%" stop-color="#9be2f5" />
      <stop offset="100%" stop-color="#e8f7fc" />
    </linearGradient>

    <radialGradient id="sunGlowP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbc531" stop-opacity="1" />
      <stop offset="40%" stop-color="#fbc531" stop-opacity="0.65" />
      <stop offset="75%" stop-color="rgba(255, 230, 110, 0.45)" />
      <stop offset="100%" stop-color="rgba(255, 230, 110, 0.45)" stop-opacity="0" />
    </radialGradient>

    <filter id="windowBlurP" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <linearGradient id="toscaGradP" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#cbc0ae" />
      <stop offset="45%" stop-color="#f8f7f4" />
      <stop offset="100%" stop-color="#dcd3c3" />
    </linearGradient>

    <linearGradient id="pineGradP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3e8e58" />
      <stop offset="100%" stop-color="#1b4d2e" />
    </linearGradient>
  </defs>

  <!-- CIELO -->
  <rect x="0" y="0" width="900" height="1600" fill="url(#skyGradP)" />

  <!-- SOL -->
  <circle cx="450" cy="130" r="180" fill="url(#sunGlowP)" />
  <circle cx="450" cy="130" r="70" fill="#fbc531" />

  <!-- NUBES ALTAS SUAVES -->
  <g opacity="0.65">
    <ellipse cx="250" cy="180" rx="140" ry="24" fill="rgba(255, 245, 225, 0.35)" />
    <ellipse cx="700" cy="240" rx="130" ry="22" fill="rgba(255, 245, 225, 0.35)" />
    <ellipse cx="450" cy="290" rx="160" ry="22" fill="rgba(255, 245, 225, 0.35)" />
  </g>

  <!-- CABLES DE LUZ SUPERIORES (Percha cielo de Gaviota) -->
  <g id="cables-altos">
    <path d="M0 120 Q450 180 900 135" stroke="#2d3436" stroke-width="2.2" fill="none" opacity="0.75" />
    <path d="M0 150 Q450 210 900 165" stroke="#2d3436" stroke-width="2.0" fill="none" opacity="0.7" />
  </g>

  <!-- PINO MARÍTIMO ALTO (Izquierda arriba, percha Benteveo en x=180, y=370) -->
  <g id="pino-alto-izq">
    <!-- Tronco robusto de pino -->
    <path d="M70 700 Q120 450 100 200 L140 200 Q150 450 120 700 Z" fill="#5d4037" />
    <!-- Rama percha benteveo -->
    <path d="M120 380 Q190 370 280 390 L278 402 Q190 385 120 396 Z" fill="#5d4037" />
    <!-- Copa de pino con agujas (pinocha) -->
    <ellipse cx="120" cy="180" rx="130" ry="55" fill="url(#pineGradP)" />
    <ellipse cx="80" cy="170" rx="80" ry="40" fill="#2e7046" />
    <ellipse cx="170" cy="175" rx="90" ry="45" fill="#1b4d2e" />
    <!-- Piñas de pino -->
    <g transform="translate(265, 400)">
      <ellipse cx="0" cy="10" rx="8" ry="14" fill="#4e342e" />
      <path d="M-6 4 Q0 12 6 4 M-7 9 Q0 17 7 9" stroke="#795548" stroke-width="1.8" fill="none" />
    </g>
  </g>

  <!-- PALMERA BUTIÁ (Derecha arriba, percha Cotorra en x=720, y=370) -->
  <g id="palmera-butia-p">
    <!-- Tronco curvado de butiá -->
    <path d="M820 750 Q785 550 800 370 L825 372 Q805 550 840 750 Z" fill="#685a4f" />
    <!-- Textura romboidal -->
    <line x1="795" y1="580" x2="815" y2="585" stroke="#3a2f27" stroke-width="2" opacity="0.4" />
    <line x1="790" y1="510" x2="810" y2="515" stroke="#3a2f27" stroke-width="2" opacity="0.4" />
    <!-- Coquitos amarillos de butiá -->
    <g>
      <ellipse cx="785" cy="410" rx="14" ry="20" fill="#f39c12" />
      <circle cx="780" cy="412" r="5" fill="#f1c40f" />
      <circle cx="792" cy="418" r="4.5" fill="#f1c40f" />
    </g>
    <!-- Grandes frondas arqueadas -->
    <path d="M810 370 Q710 320 620 400" stroke="#2d7554" stroke-width="7" fill="none" stroke-linecap="round" />
    <path d="M810 370 Q720 280 670 330" stroke="#3ea375" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M815 370 Q870 290 900 340" stroke="#2d7554" stroke-width="7" fill="none" stroke-linecap="round" />
    <path d="M812 370 Q800 240 820 200" stroke="#3ea375" stroke-width="6" fill="none" stroke-linecap="round" />
  </g>

  <!-- BOSQUE Y DUNAS INTERMEDIAS -->
  <path d="M0 720 Q450 680 900 705 L900 1600 L0 1600 Z" fill="#8fb898" />
  <path d="M0 760 Q450 730 900 745 L900 1600 L0 1600 Z" fill="#71a17b" />

  <!-- CASITA COSTERA DE UN PISO (Centro-fondo entre jardines: x=380..520, y=720..790) -->
  <g id="casa-centro">
    <ellipse cx="450" cy="795" rx="100" ry="20" fill="#44a638" opacity="0.6" />
    <rect x="390" y="735" width="120" height="48" fill="#f5f6fa" rx="2" />
    <polygon points="380,735 450,700 520,735" fill="#c0392b" />
    <rect x="490" y="705" width="14" height="26" fill="#a04000" />
    <rect x="440" y="750" width="18" height="32" fill="#795548" />
    <rect x="405" y="746" width="20" height="18" fill="#dff9fb" rx="2" />
    <rect x="475" y="746" width="20" height="18" fill="#dff9fb" rx="2" />
    
    
  </g>

  <!-- EUCALIPTO BLANCO DEL BOSQUE (Detrás de la casita) -->
  <path d="M330 750 Q340 500 335 300 L348 300 Q355 500 345 750 Z" fill="#dcdde1" opacity="0.75" />
  <ellipse cx="340" cy="300" rx="45" ry="35" fill="#5f8c74" opacity="0.8" />

  <!-- ANACAHUITA / TILO (Izquierda media, percha Zorzal en x=200, y=630) -->
  <g id="arbol-anacahuita-p">
    <path d="M180 880 Q190 750 200 660 L212 660 Q205 750 196 880 Z" fill="#4a3728" />
    <path d="M200 680 Q240 650 300 665 L298 674 Q240 660 200 690 Z" fill="#4a3728" />
    <ellipse cx="200" cy="620" rx="75" ry="55" fill="#44a638" opacity="0.9" />
    <ellipse cx="240" cy="630" rx="60" ry="45" fill="#55b948" opacity="0.85" />
    <circle cx="250" cy="645" r="4" fill="#c0392b" />
    <circle cx="265" cy="655" r="3.5" fill="#8e44ad" />
  </g>

  <!-- CEIBO EN FLOR ROJA (Derecha media, percha Cardenal en x=710, y=650) -->
  <g id="arbol-ceibo-p">
    <path d="M750 900 Q760 770 730 690 Q700 640 650 630 L655 618 Q715 628 748 680 Q780 770 765 900 Z" fill="#574b43" />
    <path d="M730 690 Q690 660 620 680 L622 688 Q685 670 725 698 Z" fill="#574b43" />
    <ellipse cx="680" cy="620" rx="65" ry="40" fill="#55b948" opacity="0.9" />
    <ellipse cx="740" cy="600" rx="70" ry="45" fill="#3b9631" opacity="0.9" />
    <!-- FLORES ROJAS DEL CEIBO -->
    <g>
      <path d="M660 650 Q650 675 665 685 Q675 670 660 650 Z" fill="#e84118" />
      <circle cx="662" cy="682" r="5" fill="#c23616" />
      <path d="M685 645 Q675 668 690 680 Q700 665 685 645 Z" fill="#e84118" />
      <path d="M720 595 Q710 620 725 630 Q735 615 720 595 Z" fill="#e84118" />
      <circle cx="723" cy="628" r="4.5" fill="#c23616" />
    </g>
  </g>

  <!-- CALLE DE TOSCA BLANCA / BALASTO URUGUAYO (Zona inferior) -->
  <g id="calle-tosca-p">
    <!-- Camino amplio de tosca -->
    <path d="M300 860 Q450 860 600 860 L850 1600 L50 1600 Z" fill="url(#toscaGradP)" />
    <!-- Huellas de rodada en la tosca -->
    <path d="M400 865 Q430 1100 280 1600" stroke="#dcd3c3" stroke-width="32" fill="none" opacity="0.65" />
    <path d="M500 865 Q580 1100 660 1600" stroke="#dcd3c3" stroke-width="34" fill="none" opacity="0.65" />
    <!-- Piedritas de balasto blanco sueltas -->
    <g fill="#ffffff" opacity="0.8">
      <ellipse cx="380" cy="1150" rx="8" ry="5" />
      <ellipse cx="480" cy="1220" rx="10" ry="6" />
      <ellipse cx="560" cy="1320" rx="9" ry="5" />
      <ellipse cx="420" cy="1400" rx="8" ry="5" />
      <ellipse cx="330" cy="1480" rx="11" ry="6" />
      <ellipse cx="520" cy="1520" rx="10" ry="6" />
    </g>
  </g>

  <!-- BANQUINAS Y CÉSPED COSTEROS (Primer plano) -->
  <path d="M0 950 Q120 930 200 980 L120 1600 L0 1600 Z" fill="#44a638" />
  <path d="M700 920 Q800 940 900 980 L900 1600 L760 1600 Z" fill="#44a638" />

  <!-- Penacho de pasto verde en el borde del camino (percha del Tero: x=450, y=1220) -->
  <ellipse cx="450" cy="1280" rx="110" ry="30" fill="#55b948" opacity="0.95" />
  <ellipse cx="440" cy="1285" rx="90" ry="20" fill="#3b9631" opacity="0.75" />
  <g stroke="#55b948" stroke-width="3.5" stroke-linecap="round">
    <path d="M380 1280 Q365 1245 355 1230" />
    <path d="M400 1280 Q395 1235 390 1220" />
    <path d="M510 1280 Q525 1240 540 1225" />
    <path d="M525 1280 Q540 1245 560 1238" />
  </g>

  <!-- ALAMBRADO DE CAMPO Y NIDO DE HORNERO -->
  <!-- Percha Hornero en x=220, y=940 -->
  <!-- Percha Chingolo en x=690, y=960 -->
  <g id="alambrado-hornero-p">
    <!-- Hilos de alambre tensados -->
    <path d="M40 1060 L220 1010 L480 1045 L690 1025 L900 1055" stroke="#2d3436" stroke-width="2.5" fill="none" opacity="0.8" />
    <path d="M40 1095 L220 1045 L480 1080 L690 1060 L900 1090" stroke="#2d3436" stroke-width="2.2" fill="none" opacity="0.75" />
    <path d="M40 1130 L220 1080 L480 1115 L690 1095 L900 1125" stroke="#2d3436" stroke-width="2.2" fill="none" opacity="0.75" />

    <!-- Poste de madera derecha (percha Chingolo) -->
    <path d="M680 1015 L700 1015 L696 1170 L676 1170 Z" fill="#636e72" />
    <ellipse cx="690" cy="1015" rx="10" ry="4" fill="#7f8c8d" />

    <!-- Poste central -->
    <path d="M472 1035 L488 1035 L485 1160 L470 1160 Z" fill="#636e72" />
    <ellipse cx="480" cy="1035" rx="8" ry="3.5" fill="#7f8c8d" />

    <!-- POSTE PRINCIPAL ESQUINERO (Soporte Nido Hornero) -->
    <path d="M206 970 L234 970 L228 1170 L200 1170 Z" fill="#636e72" />
    <ellipse cx="220" cy="970" rx="14" ry="5" fill="#7f8c8d" />
    <line x1="216" y1="980" x2="212" y2="1160" stroke="#2c3e50" stroke-width="1.5" opacity="0.3" />
  </g>
</svg>